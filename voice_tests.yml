# .github/workflows/voice_tests.yml
name: Voice Channel Tests

on: [push, pull_request]

jobs:
  voice-tests:
    runs-on: ubuntu-latest
    env:
      USE_MOCK_ASR: "true"
      USE_MOCK_POLICY_API: "true"
      USE_MOCK_RAG: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # for LLM tests only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt pytest gtts
      - run: pytest tests/ -v --tb=short -x
        name: Run all voice tests
